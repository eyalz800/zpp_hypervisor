name: ci

on:
  # Only master on push. Branch pushes are covered by their pull request, and
  # listing develop here as well meant every commit ran the whole workflow
  # twice.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  LLVM_VERSION: "22"
  CLANG_FORMAT_VERSION: "20.1.7"

jobs:
  # Tier 1 + 2: cross build every target, then assert the ELF invariants that
  # this codebase depends on and that nothing else enforces.
  build:
    name: build ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- "$LLVM_VERSION"
          sudo apt-get install -y --no-install-recommends \
            "libc++-$LLVM_VERSION-dev" "libc++abi-$LLVM_VERSION-dev" \
            "lld-$LLVM_VERSION" ninja-build
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake --preset ${{ matrix.config }}

      - name: Build
        run: cmake --build --preset ${{ matrix.config }}

      - name: Verify ELF invariants
        run: ./scripts/ci/check-invariants.sh ${{ matrix.config }}

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.config }}
          path: out/${{ matrix.config }}/x86_64/

  # The 75 column limit in .clang-format is not enforced by the build.
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned through PyPI rather than taken from an LLVM install: clang-format
      # majors disagree on formatting, so CI and developers must share an exact
      # version or this job flaps. Keep in step with CLANG_FORMAT_VERSION below
      # and the value documented in CLAUDE.md.
      - name: Install clang-format
        run: pipx install "clang-format==$CLANG_FORMAT_VERSION"
      - name: Check formatting
        run: |
          git ls-files '*.h' '*.cpp' '*.c' \
            | grep -v '^cmake/freestanding-libc/' \
            | xargs clang-format --dry-run -Werror

  # Compiles linux_loader/src/main.c, which the CMake build never touches -
  # it is the only place the kernel module glue gets type checked.
  linux-module:
    name: linux .ko
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- "$LLVM_VERSION"
          sudo apt-get install -y --no-install-recommends \
            "libc++-$LLVM_VERSION-dev" "libc++abi-$LLVM_VERSION-dev" \
            "lld-$LLVM_VERSION" ninja-build podman
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"
      - name: Build zpp_loader.o
        run: |
          cmake --preset debug
          cmake --build --preset debug --target linux_loader
      - name: Build zpp_loader.ko
        run: cmake --build --preset debug --target linux_loader_ko

  # The highest value test - Windows actually booting while the hypervisor
  # holds root mode - cannot run on a GitHub hosted runner. It needs a real
  # VT-x host, so this job only runs where a self-hosted Windows runner with
  # nested virtualization has been registered with the 'vtx' label.
  #
  # Hyper-V must be OFF. If it is running, Windows is already the root
  # partition of another hypervisor, VMX belongs to Hyper-V, and vmxon here
  # fails - this project does not support being nested yet. Note Windows 11
  # enables VBS/HVCI (which turns Hyper-V on) by default on many installs.
  windows-root-mode:
    name: windows boots in root mode
    runs-on: [self-hosted, windows, vtx]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binaries-debug
          path: out/debug/x86_64/

      - name: Assert Hyper-V and VBS are disabled
        shell: pwsh
        run: |
          $launch = (bcdedit /enum '{current}' | Select-String 'hypervisorlaunchtype')
          if ($launch -match 'Auto|On') {
            Write-Error "Hyper-V is enabled. Disable it, this project cannot run nested yet:`n" +
              "  bcdedit /set hypervisorlaunchtype off`n" +
              "  Disable-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V-All`n" +
              "  Disable-WindowsOptionalFeature -Online -FeatureName VirtualMachinePlatform`n" +
              "  then clear Memory Integrity / Credential Guard and reboot"
          }
          $dg = Get-CimInstance -ClassName Win32_DeviceGuard `
              -Namespace root\Microsoft\Windows\DeviceGuard -ErrorAction SilentlyContinue
          if ($dg -and $dg.SecurityServicesRunning -contains 1) {
            Write-Error "Credential Guard is running, which implies Hyper-V. Disable VBS and reboot."
          }
          if (-not (Get-CimInstance Win32_Processor).VirtualizationFirmwareEnabled) {
            Write-Error "VT-x is not available to this machine."
          }
          Write-Host "ok: VT-x available, Hyper-V and VBS are off"

      - name: Load the driver and confirm the OS survives root mode
        shell: pwsh
        run: |
          # The driver is unsigned, so the machine must already be in test
          # signing mode (bcdedit /set testsigning on) and rebooted.
          sc.exe create zpp_loader type= kernel binPath= "$pwd\out\debug\x86_64\zpp_loader.sys"
          sc.exe start zpp_loader
          # Surviving this far means the guest kept running after vmxon and
          # vmlaunch, which is the property under test.
          Start-Sleep -Seconds 5
          Get-Service zpp_loader
          Write-Host "ok: windows still running with the hypervisor in root mode"

  # Measures what virtualization the hosted runners actually expose, to decide
  # whether a nested guest can be given VMX. Booting a prepared Windows image
  # under QEMU/KVM would sidestep driver signature enforcement - the image can
  # have test signing enabled already, so no reboot is needed inside the job -
  # but only if VMX reaches the guest, which needs it present on the runner
  # first and then passed through by KVM. Cheap to measure, so measure it.
  probe-virtualization:
    name: probe virtualization (${{ matrix.os }})
    # Manual only. It has already answered its question - the hosted runners are
    # AMD, so there is no VMX to expose and this project cannot be tested on
    # them at all - but it is kept so the answer can be rechecked if GitHub ever
    # changes hardware.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Linux capability report
        if: runner.os == 'Linux'
        run: |
          echo "== CPU virtualization flags (want vmx; svm is AMD and unusable here)"
          grep -om1 'vmx' /proc/cpuinfo || echo "  no vmx"
          grep -om1 'svm' /proc/cpuinfo || true
          echo "== is the runner itself a guest"
          grep -om1 hypervisor /proc/cpuinfo || echo "  bare metal"
          systemd-detect-virt || true
          echo "== /dev/kvm"
          ls -l /dev/kvm 2>&1 || echo "  absent"
          echo "== nested setting on the kvm intel module"
          cat /sys/module/kvm_intel/parameters/nested 2>&1 || echo "  kvm_intel not loaded"
          echo "== can qemu actually give a guest vmx"
          sudo apt-get update -qq && sudo apt-get install -qq -y qemu-system-x86 >/dev/null
          qemu-system-x86_64 -accel kvm -cpu host,+vmx -nographic -display none \
              -S -monitor none -serial none -m 256 &
          qemu_pid=$!
          sleep 5
          kill $qemu_pid 2>/dev/null || true
          echo "(a TCG warning above means vmx was dropped and this route is dead)"
      - name: Windows capability report
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cpu = Get-CimInstance Win32_Processor
          "VirtualizationFirmwareEnabled : $($cpu.VirtualizationFirmwareEnabled)"
          "VMMonitorModeExtensions       : $($cpu.VMMonitorModeExtensions)"
          "HypervisorPresent             : $((Get-CimInstance Win32_ComputerSystem).HypervisorPresent)"
          $dg = Get-CimInstance Win32_DeviceGuard `
              -Namespace root\Microsoft\Windows\DeviceGuard -ErrorAction SilentlyContinue
          "DeviceGuard services running  : $($dg.SecurityServicesRunning -join ',')"
          "Hyper-V feature state         : $((Get-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V-All -ErrorAction SilentlyContinue).State)"
