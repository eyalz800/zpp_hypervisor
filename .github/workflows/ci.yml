name: ci

on:
  # Only master on push. Branch pushes are covered by their pull request, and
  # listing develop here as well meant every commit ran the whole workflow
  # twice.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  LLVM_VERSION: "22"

jobs:
  # Tier 1 + 2: cross build every target, then assert the ELF invariants that
  # this codebase depends on and that nothing else enforces.
  build:
    name: build ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- "$LLVM_VERSION"
          sudo apt-get install -y --no-install-recommends \
            "libc++-$LLVM_VERSION-dev" "libc++abi-$LLVM_VERSION-dev" \
            "lld-$LLVM_VERSION" ninja-build
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake --preset ${{ matrix.config }}

      - name: Build
        run: cmake --build --preset ${{ matrix.config }}

      - name: Verify ELF invariants
        run: ./scripts/ci/check-invariants.sh ${{ matrix.config }}

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.config }}
          path: out/${{ matrix.config }}/x86_64/

  # Every hosted harness and every source-level check, in one job.
  #
  # This job exists because an audit of the whole history found that they
  # were not run at all. Six harnesses under tests/ and several
  # compile-only checks under scripts/ci/ - together about eleven thousand
  # lines of assertions - and this workflow invoked two of them. Nothing
  # else did either: no ctest, no Makefile, no runner.
  #
  # It was not a theoretical gap. When the runner was first written, four
  # of the eleven did not even compile: three harness shims had drifted
  # from hypervisor.cpp as members were added, and one decoder assertion
  # was still asserting behaviour the decoder had deliberately stopped
  # having. All four were caught by the first run.
  #
  # No emulator, no target and no cross toolchain: everything here is
  # compiled natively for the host, so this is the cheapest job in the
  # workflow and the one most likely to catch a mistake.
  host-tests:
    name: host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- "$LLVM_VERSION"
          sudo apt-get install -y --no-install-recommends \
            "libc++-$LLVM_VERSION-dev" "libc++abi-$LLVM_VERSION-dev"
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"
      # The decoder harness is a differential against LLVM's own
      # assembler and disassembler, so it needs those two by name.
      - name: Run every hosted test
        env:
          CXX: clang++
          LLVM_MC: llvm-mc
          LLVM_OBJDUMP: llvm-objdump
        run: ./scripts/ci/run-host-tests.sh

  # The 75 column limit in .clang-format is not enforced by the build.
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deliberately unpinned. This used to name an exact version, on the
      # grounds that clang-format majors disagree and CI would otherwise
      # flap - but the pin cost more than the flapping did, because every
      # machine that had a newer clang-format on it had to install a second
      # one to touch a single line. Formatting is a tidiness check, not a
      # correctness one, so take whatever is current and reformat the tree
      # when a new major moves something.
      - name: Install clang-format
        run: pipx install clang-format
      - name: Check formatting
        run: |
          git ls-files '*.h' '*.cpp' '*.c' \
            | grep -v '^cmake/freestanding-libc/' \
            | xargs clang-format --dry-run -Werror

  # Compiles linux_loader/src/main.c, which the CMake build never touches -
  # it is the only place the kernel module glue gets type checked.
  linux-module:
    name: linux .ko
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- "$LLVM_VERSION"
          sudo apt-get install -y --no-install-recommends \
            "libc++-$LLVM_VERSION-dev" "libc++abi-$LLVM_VERSION-dev" \
            "lld-$LLVM_VERSION" ninja-build podman
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"
      - name: Build zpp_loader.o
        run: |
          cmake --preset debug
          cmake --build --preset debug --target linux_loader
      - name: Build zpp_loader.ko
        run: cmake --build --preset debug --target linux_loader_ko

  # Boots the UEFI loader under Bochs' software emulated VMX and asserts the
  # hypervisor identifies itself through CPUID leaf 0x40000000, on the boot
  # processor and on every processor it has to take over from a guest's own
  # INIT-SIPI-SIPI. Bochs needs no hardware virtualization, which is what
  # makes this possible at all: the hosted runners are AMD and expose no vmx,
  # so this is the only way to exercise vmxon, vmlaunch and the exit handler
  # in CI.
  bochs-vmx:
    name: bochs vmx ${{ matrix.config }} (emulated VT-x)
    runs-on: ubuntu-latest
    needs: build
    # Both configurations, because this is the only job that runs the code
    # rather than just building it, and the two differ in ways that can break
    # exactly this path: the recovery point the host IDT unwinds to is a
    # capture_context/restore_context pair the optimizer knows nothing about,
    # and the entry stub table depends on the assembler laying naked functions
    # out as written. A release-only failure here is entirely possible.
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Bochs
        id: bochs-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bochs-smp
          key: bochs-3.0-smp-vmx2-${{ runner.os }}

      - name: Build Bochs with VMX emulation
        if: steps.bochs-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
          curl -sLO https://downloads.sourceforge.net/project/bochs/bochs/3.0/bochs-3.0.tar.gz
          tar xzf bochs-3.0.tar.gz && cd bochs-3.0
          # basename without <libgen.h> breaks on some toolchains.
          sed -i 's|#include "param_names.h"|#include <libgen.h>\n#include "param_names.h"|' \
              gui/keymap.cc
          # SMP without the gdb stub, because CI never attaches a debugger
          # and the smoke test needs several processors: with one there is
          # nothing to send a start-up IPI to, so it cannot exercise the
          # INIT-SIPI-SIPI path at all - which is how a broken one reached
          # real hardware.
          #
          # Not because the two cannot coexist. bochs.h has an #error
          # saying the stub was written for one processor, but it is a
          # guard rather than a limit and the combination has been built
          # and run locally with four processors and gdb attached, at the
          # cost of pinning the stub to processor 0. It is left out here
          # only because it would buy CI nothing. Interactive debugging
          # uses a local build; see scripts/bochs/run.sh, which honours
          # $BOCHS.
          ./configure --prefix="$HOME/.local/bochs-smp" \
            --enable-smp --enable-vmx=2 --enable-x86-64 \
            --enable-cpu-level=6 --enable-avx --enable-evex --enable-pci \
            --enable-a20-pin --enable-fpu --enable-long-phy-address \
            --enable-large-ramfile --enable-logging --enable-show-ips \
            --with-nogui
          make -j"$(nproc)" && make install

      - name: Install boot medium tooling
        run: sudo apt-get install -y --no-install-recommends mtools ovmf

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- "$LLVM_VERSION"
          sudo apt-get install -y --no-install-recommends \
            "libc++-$LLVM_VERSION-dev" "libc++abi-$LLVM_VERSION-dev" \
            "lld-$LLVM_VERSION" ninja-build
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"

      # Built here rather than reusing the artifact, because the self check is
      # compiled in only when asked for and the normal build leaves it out.
      - name: Build with the hypervisor self check enabled
        run: |
          cmake --preset ${{ matrix.config }} -DZPP_VERIFY_HYPERVISOR=ON
          cmake --build --preset ${{ matrix.config }}

      - name: Build boot medium
        run: ./scripts/bochs/setup.sh ${{ matrix.config }}

      # Four processors, because the check is now a multiprocessor one and
      # with a single processor half of it does not run at all. The loader
      # launches the hypervisor on the boot processor alone and then does
      # what an operating system does: enables x2APIC, so the interrupt
      # command register is the MSR the hypervisor intercepts, and sends
      # each other processor a real INIT-SIPI-SIPI. What answers CPUID leaf
      # 0x40000000 on those processors is the whole result - it says whether
      # the hypervisor adopted them on the way through.
      - name: Assert the hypervisor reaches root mode on every cpu
        env:
          CPUS: 4
          TIMEOUT: 280
        run: BOCHS="$HOME/.local/bochs-smp/bin/bochs" ./scripts/ci/bochs-smoke.sh

  # Runs the guest-side coverage suite: the VM exit handler's cases, the
  # extended page tables and the store emulation, asked from inside the
  # guest and graded against the SDM. See uefi_loader/include/zpp/
  # guest_tests.h for why the questions can only be asked from there.
  #
  # Separate from bochs-vmx rather than folded into it. That job runs
  # verify::present, which is destructive by design - it takes every
  # application processor away from the firmware - so anything this suite
  # reported after it would be describing a machine that check had already
  # taken apart. The two switches are mutually exclusive in the build
  # system for the same reason.
  bochs-exit-coverage:
    name: bochs exit coverage (${{ matrix.config }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    steps:
      - uses: actions/checkout@v4

      # Same key as bochs-vmx, deliberately: one Bochs serves both, and
      # whichever job reaches a cold cache first pays for it once.
      - name: Cache Bochs
        id: bochs-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bochs-smp
          key: bochs-3.0-smp-vmx2-${{ runner.os }}

      - name: Build Bochs with VMX emulation
        if: steps.bochs-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
          curl -sLO https://downloads.sourceforge.net/project/bochs/bochs/3.0/bochs-3.0.tar.gz
          tar xzf bochs-3.0.tar.gz && cd bochs-3.0
          sed -i 's|#include "param_names.h"|#include <libgen.h>\n#include "param_names.h"|' \
              gui/keymap.cc
          ./configure --prefix="$HOME/.local/bochs-smp" \
            --enable-smp --enable-vmx=2 --enable-x86-64 \
            --enable-cpu-level=6 --enable-avx --enable-evex --enable-pci \
            --enable-a20-pin --enable-fpu --enable-long-phy-address \
            --enable-large-ramfile --enable-logging --enable-show-ips \
            --with-nogui
          make -j"$(nproc)" && make install

      - name: Install boot medium tooling
        run: sudo apt-get install -y --no-install-recommends mtools ovmf

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- "$LLVM_VERSION"
          sudo apt-get install -y --no-install-recommends \
            "libc++-$LLVM_VERSION-dev" "libc++abi-$LLVM_VERSION-dev" \
            "lld-$LLVM_VERSION" ninja-build
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"

      # ZPP_DIAG=OFF, and it is about the clock rather than about scope.
      #
      # With the diagnostic facility on, the loader establishes the ESP
      # reservation and then restarts the machine so the channel is live
      # on the next boot - which is right on a real machine and costs a
      # second whole OVMF boot here, about three minutes of the budget for
      # a facility none of these cases touch. Measured: 68 seconds with it
      # off against a run that had not reached the suite at all after 600
      # with it on.
      - name: Build with the guest coverage suite enabled
        run: |
          cmake --preset ${{ matrix.config }} \
            -DZPP_GUEST_TESTS=ON -DZPP_DIAG=OFF
          cmake --build --preset ${{ matrix.config }}

      # The switch persists in a CMake cache, and a loader without the
      # suite produces no result lines at all - which reads exactly like a
      # boot that never got that far. Asserted rather than assumed, in
      # both directions: check-bootable.sh must refuse this loader, and a
      # run of it that it did not refuse would mean the marker had drifted.
      - name: Assert the loader carries the suite and is refused for boot
        run: |
          if ./scripts/check-bootable.sh \
              out/${{ matrix.config }}/x86_64/zpp_loader.efi; then
            echo "check-bootable.sh accepted a guest-test loader" >&2
            exit 1
          fi

      - name: Build boot medium
        run: ./scripts/bochs/setup.sh ${{ matrix.config }}

      - name: Run the coverage suite
        env:
          CONFIG: ${{ matrix.config }}
          TIMEOUT: 420
        run: |
          BOCHS="$HOME/.local/bochs-smp/bin/bochs" \
            ./scripts/ci/bochs-exit-coverage.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exit-coverage-${{ matrix.config }}
          path: |
            build/bochs/results.xml
            build/bochs/results.json
            build/bochs/coverage.txt
            build/bochs/serial.out
            build/bochs/bochs.log

  probe-virtualization:
    name: probe virtualization (${{ matrix.os }})
    # Manual only. It has already answered its question - the hosted runners are
    # AMD, so there is no VMX to expose and this project cannot be tested on
    # them at all - but it is kept so the answer can be rechecked if GitHub ever
    # changes hardware.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Linux capability report
        if: runner.os == 'Linux'
        run: |
          echo "== CPU virtualization flags (want vmx; svm is AMD and unusable here)"
          grep -om1 'vmx' /proc/cpuinfo || echo "  no vmx"
          grep -om1 'svm' /proc/cpuinfo || true
          echo "== is the runner itself a guest"
          grep -om1 hypervisor /proc/cpuinfo || echo "  bare metal"
          systemd-detect-virt || true
          echo "== /dev/kvm"
          ls -l /dev/kvm 2>&1 || echo "  absent"
          echo "== nested setting on the kvm intel module"
          cat /sys/module/kvm_intel/parameters/nested 2>&1 || echo "  kvm_intel not loaded"
          echo "== can qemu actually give a guest vmx"
          sudo apt-get update -qq && sudo apt-get install -qq -y qemu-system-x86 >/dev/null
          qemu-system-x86_64 -accel kvm -cpu host,+vmx -nographic -display none \
              -S -monitor none -serial none -m 256 &
          qemu_pid=$!
          sleep 5
          kill $qemu_pid 2>/dev/null || true
          echo "(a TCG warning above means vmx was dropped and this route is dead)"
      - name: Windows capability report
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cpu = Get-CimInstance Win32_Processor
          "VirtualizationFirmwareEnabled : $($cpu.VirtualizationFirmwareEnabled)"
          "VMMonitorModeExtensions       : $($cpu.VMMonitorModeExtensions)"
          "HypervisorPresent             : $((Get-CimInstance Win32_ComputerSystem).HypervisorPresent)"
          $dg = Get-CimInstance Win32_DeviceGuard `
              -Namespace root\Microsoft\Windows\DeviceGuard -ErrorAction SilentlyContinue
          "DeviceGuard services running  : $($dg.SecurityServicesRunning -join ',')"
          "Hyper-V feature state         : $((Get-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V-All -ErrorAction SilentlyContinue).State)"
